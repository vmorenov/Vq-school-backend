server {
  listen 8080;
  client_max_body_size 21m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  # Same origin for browser cookies, federation assets and APIs.
  location /auth/ {
    proxy_pass http://keycloak:8080/auth/;
    proxy_set_header Host $http_host;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port 8080;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location ~ ^/(api/|oauth2/|login/|logout$) {
    proxy_pass http://bff:8080;
    proxy_set_header Host $http_host;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port 8080;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location /mfe/academic/ { proxy_pass http://academic:8080/; }
  location /mfe/learning/ { proxy_pass http://learning-web:8080/; }
  location /public/ { proxy_pass http://public-web:8080/; }
  location / { proxy_pass http://shell:8080; }
}
